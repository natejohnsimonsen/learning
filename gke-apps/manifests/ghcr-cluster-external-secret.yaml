apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: ghcr-pull-secret
spec:
  # Deploy to all namespaces
  namespaceSelector:
    matchLabels: {}
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: onepassword
      kind: ClusterSecretStore
    target:
      name: ghcr-pull-secret
      template:
        type: kubernetes.io/dockerconfigjson
        engineVersion: v2
        data:
          .dockerconfigjson: |
            {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
    data:
      - secretKey: username
        remoteRef:
          # 1Password item named "ghcr-credentials" in your "Kubernetes" vault
          key: ghcr-credentials
          property: username
      - secretKey: token
        remoteRef:
          key: ghcr-credentials
          property: token
