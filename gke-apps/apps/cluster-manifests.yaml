apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-manifests
  namespace: argocd
  annotations:
    # Wave 0 ensures cert-manager CRDs (wave -1) are ready before ClusterIssuer is applied
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/natejohnsimonsen/learning
    targetRevision: HEAD
    path: gke-apps/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
