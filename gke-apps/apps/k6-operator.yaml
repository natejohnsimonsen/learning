apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k6-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k6-operator
    targetRevision: "*"
    helm:
      releaseName: k6-operator
      values: |
        imagePullSecrets:
          - name: ghcr-pull-secret
        manager:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: k6-operator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
