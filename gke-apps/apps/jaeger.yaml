apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://jaegertracing.github.io/helm-charts
    chart: jaeger
    targetRevision: "*"
    helm:
      releaseName: jaeger
      values: |
        allInOne:
          enabled: true
        collector:
          enabled: false
        query:
          enabled: false
        agent:
          enabled: false
        provisionDataStore:
          cassandra: false
        storage:
          type: memory
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
