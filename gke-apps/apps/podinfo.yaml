apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "*"
    helm:
      releaseName: podinfo
      values: |
        imagePullSecrets:
          - name: ghcr-pull-secret
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 64Mi
        replicaCount: 2
        ui:
          color: "#4CAF50"
          message: "Hello from GKE!"
        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - host: podinfo.natejsimonsen.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: podinfo-tls
              hosts:
                - podinfo.natejsimonsen.com
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
