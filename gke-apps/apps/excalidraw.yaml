apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: excalidraw
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://bjw-s.github.io/helm-charts
    chart: app-template
    targetRevision: "4.*"
    helm:
      releaseName: excalidraw
      values: |
        controllers:
          excalidraw:
            containers:
              app:
                image:
                  repository: excalidraw/excalidraw
                  tag: latest
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
        service:
          app:
            controller: excalidraw
            ports:
              http:
                port: 80
        ingress:
          app:
            className: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - host: excalidraw.natejsimonsen.com
                paths:
                  - path: /
                    service:
                      identifier: app
                      port: http
            tls:
              - secretName: excalidraw-tls
                hosts:
                  - excalidraw.natejsimonsen.com
  destination:
    server: https://kubernetes.default.svc
    namespace: excalidraw
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
