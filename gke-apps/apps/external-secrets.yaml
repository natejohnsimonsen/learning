apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "*"
    helm:
      releaseName: external-secrets
      values: |
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi
        certController:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
        webhook:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
