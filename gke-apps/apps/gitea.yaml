apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts
    chart: gitea
    targetRevision: "*"
    helm:
      releaseName: gitea
      values: |
        global:
          imagePullSecrets:
            - ghcr-pull-secret
        gitea:
          admin:
            username: gitea_admin
            password: changeme123
            email: admin@example.com
          config:
            server:
              DOMAIN: gitea.natejsimonsen.com
              ROOT_URL: https://gitea.natejsimonsen.com
        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - host: gitea.natejsimonsen.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: gitea-tls
              hosts:
                - gitea.natejsimonsen.com
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: true
        redis-cluster:
          enabled: false
        redis:
          enabled: true
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
        persistence:
          size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
