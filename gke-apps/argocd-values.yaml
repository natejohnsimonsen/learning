server:
  extraArgs:
    - --insecure
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      memory: 4Gi

applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      memory: 2Gi

redis-ha:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 1Gi
  haproxy:
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        memory: 512Mi
