{{- if .Values.grafanaCloud.prometheus.token }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  GRAFANA_CLOUD_PROMETHEUS_URL: {{ .Values.grafanaCloud.prometheus.url | quote }}
  GRAFANA_CLOUD_METRICS_USER: {{ .Values.grafanaCloud.prometheus.username | quote }}
  GRAFANA_CLOUD_PROM_TOKEN: {{ .Values.grafanaCloud.prometheus.token | quote }}
  GRAFANA_CLOUD_LOKI_URL: {{ .Values.grafanaCloud.loki.url | quote }}
  GRAFANA_CLOUD_LOGS_USER: {{ .Values.grafanaCloud.loki.username | quote }}
  GRAFANA_CLOUD_LOKI_TOKEN: {{ .Values.grafanaCloud.loki.token | quote }}
  GRAFANA_CLOUD_TEMPO_ENDPOINT: {{ .Values.grafanaCloud.tempo.endpoint | quote }}
  GRAFANA_CLOUD_TEMPO_USER: {{ .Values.grafanaCloud.tempo.username | quote }}
  GRAFANA_CLOUD_TEMPO_TOKEN: {{ .Values.grafanaCloud.tempo.token | quote }}
  GRAFANA_CLOUD_PROFILES_URL: {{ .Values.grafanaCloud.profiles.url | quote }}
  GRAFANA_CLOUD_PROFILES_USER: {{ .Values.grafanaCloud.profiles.username | quote }}
  GRAFANA_CLOUD_PROFILES_TOKEN: {{ .Values.grafanaCloud.profiles.token | quote }}
{{- end }}
