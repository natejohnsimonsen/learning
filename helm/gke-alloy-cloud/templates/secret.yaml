apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Grafana Cloud Stack Details
  # Get these from grafana.com -> My Account -> Stack -> "Configure" for each telemetry type
  GRAFANA_CLOUD_API_KEY: {{ .Values.grafanaCloud.apiKey | required "grafanaCloud.apiKey is required" | quote }}
  GRAFANA_CLOUD_PROMETHEUS_URL: {{ .Values.grafanaCloud.prometheus.url | required "grafanaCloud.prometheus.url is required" | quote }}
  GRAFANA_CLOUD_METRICS_USER: {{ .Values.grafanaCloud.prometheus.username | required "grafanaCloud.prometheus.username is required" | quote }}
  GRAFANA_CLOUD_LOKI_URL: {{ .Values.grafanaCloud.loki.url | required "grafanaCloud.loki.url is required" | quote }}
  GRAFANA_CLOUD_LOGS_USER: {{ .Values.grafanaCloud.loki.username | required "grafanaCloud.loki.username is required" | quote }}
  GRAFANA_CLOUD_TEMPO_ENDPOINT: {{ .Values.grafanaCloud.tempo.endpoint | required "grafanaCloud.tempo.endpoint is required" | quote }}
  GRAFANA_CLOUD_TEMPO_USER: {{ .Values.grafanaCloud.tempo.username | required "grafanaCloud.tempo.username is required" | quote }}
  GRAFANA_CLOUD_PROFILES_URL: {{ .Values.grafanaCloud.profiles.url | required "grafanaCloud.profiles.url is required" | quote }}
  GRAFANA_CLOUD_PROFILES_USER: {{ .Values.grafanaCloud.profiles.username | required "grafanaCloud.profiles.username is required" | quote }}
