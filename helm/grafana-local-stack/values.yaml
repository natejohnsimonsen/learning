# ============================================================
# kube-prometheus-stack - Prometheus, Grafana, Alertmanager
# ============================================================
kube-prometheus-stack:
  # Grafana with all local datasources pre-configured
  grafana:
    enabled: true
    adminPassword: "admin"  # Change this

    service:
      type: LoadBalancer  # Change to ClusterIP + ingress for production

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://kube-prometheus-stack-prometheus:9090
            isDefault: true
            jsonData:
              timeInterval: 30s

          - name: Loki
            type: loki
            uid: loki
            url: http://loki-gateway
            jsonData:
              derivedFields:
                - datasourceUid: tempo
                  matcherRegex: '"trace_id":"(\w+)"'
                  name: TraceID
                  url: "$${__value.raw}"
                  urlDisplayLabel: "View Trace"

          - name: Tempo
            type: tempo
            uid: tempo
            url: http://tempo:3100
            jsonData:
              tracesToLogsV2:
                datasourceUid: loki
                spanStartTimeShift: "-1m"
                spanEndTimeShift: "1m"
                filterByTraceID: true
                filterBySpanID: false
              tracesToMetrics:
                datasourceUid: prometheus
              serviceMap:
                datasourceUid: prometheus
              nodeGraph:
                enabled: true
              lokiSearch:
                datasourceUid: loki

          - name: Pyroscope
            type: grafana-pyroscope-datasource
            uid: pyroscope
            url: http://pyroscope:4040

    # Install useful dashboards for Kubernetes
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes

    dashboards:
      kubernetes:
        # Kubernetes cluster overview
        k8s-cluster:
          gnetId: 7249
          revision: 1
          datasource: Prometheus
        # Node exporter full
        node-exporter:
          gnetId: 1860
          revision: 37
          datasource: Prometheus
        # Kubernetes pods
        k8s-pods:
          gnetId: 6417
          revision: 1
          datasource: Prometheus
        # Loki logs dashboard
        loki-logs:
          gnetId: 13639
          revision: 2
          datasource: Loki

    plugins:
      - grafana-pyroscope-app

    grafana.ini:
      feature_toggles:
        enable: traceToProfiles

  # Prometheus configuration
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 30d
      retentionSize: "50GB"
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 4Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: standard-rwo  # GKE default SSD-backed RWO
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      # Scrape all pods with prometheus.io/scrape=true
      additionalScrapeConfigs:
        - job_name: "kubernetes-pods"
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod

  # Alertmanager
  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard-rwo
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  # Node exporter for node-level metrics
  nodeExporter:
    enabled: true

  # kube-state-metrics for K8s object metrics
  kubeStateMetrics:
    enabled: true

# ============================================================
# Loki - Log aggregation (SingleBinary mode for local/dev)
# ============================================================
loki:
  deploymentMode: SingleBinary

  loki:
    commonConfig:
      replication_factor: 1
    auth_enabled: false
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: standard-rwo
      size: 20Gi

  # Disable components not needed in single-binary mode
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  gateway:
    enabled: true
    service:
      type: ClusterIP

  # Grafana Agent / Alloy pushes logs here
  test:
    enabled: false

# ============================================================
# Tempo - Distributed tracing
# ============================================================
tempo:
  tempo:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    # Receive traces via OTLP, Jaeger, Zipkin
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
      jaeger:
        protocols:
          thrift_http:
            endpoint: "0.0.0.0:14268"
          grpc:
            endpoint: "0.0.0.0:14250"
      zipkin:
        endpoint: "0.0.0.0:9411"

    # Enable service graph and span metrics for Prometheus
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://kube-prometheus-stack-prometheus:9090/api/v1/write"

  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 20Gi

# ============================================================
# Pyroscope - Continuous profiling
# ============================================================
pyroscope:
  pyroscope:
    replicationFactor: 1

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi

  # Memberlist for single-node mode
  minio:
    enabled: false

  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 10Gi

# ============================================================
# Alloy - Local collector (sends to local backends)
# ============================================================
alloy:
  alloy:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

    configMap:
      content: |
        // ============================================================
        // KUBERNETES DISCOVERY
        // ============================================================

        discovery.kubernetes "nodes" {
          role = "node"
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.kubernetes "endpoints" {
          role = "endpoints"
        }

        // ============================================================
        // METRICS - Kubelet
        // ============================================================

        discovery.relabel "kubelet" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc.cluster.local:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/$1/proxy/metrics"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
        }

        prometheus.scrape "kubelet" {
          targets           = discovery.relabel.kubelet.output
          scrape_interval   = "30s"
          scheme            = "https"
          tls_config {
            ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            insecure_skip_verify = true
          }
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          forward_to        = [prometheus.remote_write.local.receiver]
        }

        // ============================================================
        // METRICS - cAdvisor
        // ============================================================

        discovery.relabel "cadvisor" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc.cluster.local:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
        }

        prometheus.scrape "cadvisor" {
          targets           = discovery.relabel.cadvisor.output
          scrape_interval   = "30s"
          scheme            = "https"
          tls_config {
            insecure_skip_verify = true
          }
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          forward_to        = [prometheus.remote_write.local.receiver]
        }

        // ============================================================
        // METRICS - Annotated pods
        // ============================================================

        discovery.relabel "annotated_pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
            regex         = "true"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_phase"]
            regex         = "Pending|Succeeded|Failed|Completed"
            action        = "drop"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
          }
          rule {
            source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
            regex         = "([^:]+)(?::\\d+)?;(\\d+)"
            replacement   = "$1:$2"
            target_label  = "__address__"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
        }

        prometheus.scrape "annotated_pods" {
          targets         = discovery.relabel.annotated_pods.output
          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.local.receiver]
        }

        prometheus.remote_write "local" {
          endpoint {
            url = "http://kube-prometheus-stack-prometheus:9090/api/v1/write"
          }
          external_labels = {
            cluster = "local",
          }
        }

        // ============================================================
        // LOGS -> Local Loki
        // ============================================================

        loki.source.kubernetes "pods" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [loki.process.enrich.receiver]
        }

        loki.source.kubernetes_events "events" {
          job_name   = "integrations/kubernetes/eventhandler"
          log_format = "logfmt"
          forward_to = [loki.process.enrich.receiver]
        }

        loki.process "enrich" {
          forward_to = [loki.write.local.receiver]
          stage.kubernetes {}
          stage.labels {
            values = {
              namespace = "",
              pod       = "",
              container = "",
              node      = "",
            }
          }
        }

        loki.write "local" {
          endpoint {
            url = "http://loki-gateway/loki/api/v1/push"
          }
          external_labels = {
            cluster = "local",
          }
        }

        // ============================================================
        // TRACES -> Local Tempo
        // ============================================================

        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.processor.batch.default.input]
          }
        }

        otelcol.processor.batch "default" {
          output {
            traces = [otelcol.exporter.otlp.local_tempo.input]
          }
        }

        otelcol.exporter.otlp "local_tempo" {
          client {
            endpoint = "tempo:4317"
            tls {
              insecure = true
            }
          }
        }

        // ============================================================
        // PROFILES -> Local Pyroscope
        // Annotate pods with: profiles.grafana.com/scrape: "true"
        // ============================================================

        discovery.relabel "profiling_pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_profiles_grafana_com_scrape"]
            regex         = "true"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_phase"]
            regex         = "Pending|Succeeded|Failed|Completed"
            action        = "drop"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_profiles_grafana_com_port"]
            regex         = "(\\d+)"
            target_label  = "__profile_port__"
          }
          rule {
            source_labels = ["__address__", "__profile_port__"]
            regex         = "([^:]+)(?::\\d+)?;(\\d+)"
            replacement   = "$1:$2"
            target_label  = "__address__"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
        }

        pyroscope.scrape "kubernetes_pods" {
          targets         = discovery.relabel.profiling_pods.output
          forward_to      = [pyroscope.write.local.receiver]
          scrape_interval = "15s"

          profiling_config {
            profile.block {
              enabled = true
            }
            profile.goroutine {
              enabled = true
            }
            profile.memory {
              enabled = true
            }
            profile.mutex {
              enabled = true
            }
            profile.process_cpu {
              enabled = true
            }
          }
        }

        pyroscope.write "local" {
          endpoint {
            url = "http://pyroscope:4040"
          }
          external_labels = {
            cluster = "local",
          }
        }

  serviceAccount:
    create: true

  controller:
    type: deployment
    replicas: 1

  service:
    enabled: true
    type: ClusterIP
